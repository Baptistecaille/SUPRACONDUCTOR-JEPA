[project]
name = "supra-jepa"
version = "0.1.0"
description = "JEPA-based superconductor classifier on crystal token sequences"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matminer",
    "mp-api",
    "pymatgen",
    "spglib",
    "torch",
    "scikit-learn",
]

[project.scripts]
prepare-data = "scripts.prepare_data:main"
pretrain     = "pretrain:main"
finetune     = "finetune:main"
